# One-shot jobs: tests, formatting and (from phase 2) deployments.
# Usage: docker compose -f compose.yaml -f compose.tools.yaml run --rm contracts test
services:
  contracts:
    profiles: ["tools"]
    build:
      context: ./contracts
      args:
        FOUNDRY_VERSION: ${FOUNDRY_VERSION:-v1.5.1@sha256:3a70bfa9bd2c732a767bb60d12c8770b40e8f9b6cca28efc4b12b1be81c7f28e}
    image: ${CONTRACTS_IMAGE:-dapp-tk-contracts:local}
    working_dir: /app
    env_file:
      - path: ${ENV_FILE:-.env.dev}
        required: false
    volumes:
      - ./contracts:/app
      - ./deployments:/app/deployments
      - foundry_cache:/home/foundry/.svm
    networks:
      - internal

volumes:
  foundry_cache:
