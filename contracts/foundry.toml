# Foundry configuration — contracts toolchain.
# Phase 1: only the smoke test exists. SaleToken/TokenSale arrive in phase 2.

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "shanghai"
fs_permissions = [{ access = "read", path = "./deployments" }]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32

[rpc_endpoints]
localhost = "http://anvil:8545"
