name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  naming:
    name: Naming rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check file names
        run: ./scripts/check-file-names.sh

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check internal links
        run: ./scripts/check-links.sh

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose files
        run: |
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet
          docker compose -f compose.yaml -f compose.tools.yaml config --quiet

  contracts:
    name: Contracts (forge)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build contracts image
        run: docker build -t dapp-tk-contracts:ci ./contracts
      - name: Check formatting
        run: docker run --rm -v "$PWD/contracts:/app" -w /app dapp-tk-contracts:ci fmt --check
      - name: Run tests
        run: docker run --rm -v "$PWD/contracts:/app" -w /app dapp-tk-contracts:ci test -vvv

  web:
    name: Web (next)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
      - name: Build production image
        working-directory: .
        run: docker build --target runner -t dapp-tk-web:ci ./web
